## nginx/nginx.conf
## Single-entry-point reverse proxy for Disaster Response AI
## Routes: / -> Next.js frontend:3000  |  /api/ -> FastAPI:8000  |  /docs -> FastAPI:8000/docs
## Enable in docker-compose.yml by uncommenting the nginx service block

worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    gzip  on;
    gzip_types text/plain application/json text/css application/javascript;

    # Upstream definitions
    upstream fastapi_backend {
        server api:8000;
        keepalive 32;
    }

    upstream nextjs_frontend {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  _;

        # -----------------------------------------------------------------
        # FastAPI backend: /api/* -> api:8000/*
        # -----------------------------------------------------------------
        location /api/ {
            proxy_pass         http://fastapi_backend/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # FastAPI Swagger UI
        location /docs {
            proxy_pass         http://fastapi_backend/docs;
            proxy_set_header   Host $host;
        }
        location /redoc {
            proxy_pass         http://fastapi_backend/redoc;
            proxy_set_header   Host $host;
        }
        location /openapi.json {
            proxy_pass         http://fastapi_backend/openapi.json;
        }

        # -----------------------------------------------------------------
        # Next.js frontend: / -> frontend:3000
        # Including WebSocket support for Hot Module Replacement
        # -----------------------------------------------------------------
        location / {
            proxy_pass         http://nextjs_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
        }

        # Next.js static assets (cache aggressively)
        location /_next/static/ {
            proxy_pass     http://nextjs_frontend/_next/static/;
            expires        1y;
            add_header     Cache-Control "public, immutable";
        }

        # Health probe (returns 200 directly from nginx - useful for LB health)
        location /nginx-health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
