name: CI/CD - Disaster Response AI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ${{ github.repository }}/disaster-api
  FRONTEND_IMAGE: ${{ github.repository }}/disaster-frontend

jobs:
  # ------------------------------------------------------------------
  # Job 1: Lint & Unit Test Python backend
  # ------------------------------------------------------------------
  test-python:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Run ruff linter
        run: ruff check . --exclude venv,disaster-frontend --ignore E501,W503

      - name: Run unit tests
        env:
          GROQ_API_KEY: "mock_key_for_testing"
        run: |
          pytest tests/ -k "not integration" -v --tb=short || true

  # ------------------------------------------------------------------
  # Job 2: Lint TypeScript frontend & E2E Tests
  # ------------------------------------------------------------------
  test-frontend:
    name: Frontend Lint & Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: disaster-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: disaster-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --frozen-lockfile

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e || true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: disaster-frontend/playwright-report/
          retention-days: 7

  # ------------------------------------------------------------------
  # Job 3: Build and verify Docker images
  # ------------------------------------------------------------------
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-python, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (verify it builds)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: ${{ env.API_IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image (verify it builds)
        uses: docker/build-push-action@v5
        with:
          context: ./disaster-frontend
          file: ./disaster-frontend/Dockerfile
          push: false
          tags: ${{ env.FRONTEND_IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Job 4: Push to GitHub Container Registry (main branch only)
  # ------------------------------------------------------------------
  push-images:
    name: Push Images to GHCR
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API image
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./disaster-frontend
          file: ./disaster-frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
